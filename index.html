<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日運動紀錄與訓練量管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
        }
        /* 避免 iOS Safari 點擊輸入框自動放大，並修正手機版日期框過大與跑版問題 */
        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
        input[type="date"],
        input[type="month"] {
            -webkit-appearance: none;
            appearance: none;
            min-width: 0;
            max-width: 100%;
            height: 40px;
            line-height: 1.25rem;
            box-sizing: border-box;
        }
        input[type="date"]::-webkit-date-and-time-value,
        input[type="month"]::-webkit-date-and-time-value {
            text-align: left;
            margin: 0;
        }
        /* 列印 / PDF 專用樣式 */
        @media print {
            body {
                background-color: #ffffff !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .print-break-inside-avoid {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-500 flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-dumbbell text-lg text-white"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight">每日運動紀錄系統</h1>
                    <p class="text-[11px] sm:text-xs text-slate-400">自動訓練量試算 ‧ 單日併排綜整 ‧ 試算表/Word/PDF 匯出</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <button type="button" onclick="openExportModal()"
                    class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs sm:text-sm font-bold flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-file-export"></i>
                    <span>匯出報表 (試算表 / Word / PDF)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 no-print">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

            <!-- 左側：新增 / 編輯運動紀錄表單 (佔 5 欄) -->
            <section class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6 lg:sticky lg:top-20">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3.5 mb-4">
                    <div class="flex items-center gap-2.5">
                        <span id="formModeBadge" class="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-xs font-bold">
                            <i class="fa-solid fa-plus"></i>
                        </span>
                        <h2 id="formTitle" class="text-base sm:text-lg font-bold text-slate-800">新增運動項目</h2>
                    </div>
                    <button type="button" id="cancelEditBtn" onclick="resetWorkoutForm()"
                        class="hidden text-xs font-bold text-rose-600 hover:text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg transition">
                        取消編輯
                    </button>
                </div>

                <form id="workoutForm" onsubmit="handleSaveWorkout(event)" class="space-y-4">
                    <input type="hidden" id="editingSessionId" value="">

                    <!-- 1. 日期與地點 (手機版也保持雙欄精巧並排，避免日期框單獨撐滿整行過大) -->
                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                        <div class="min-w-0">
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">
                                1. 運動日期 <span class="text-rose-500">*</span>
                            </label>
                            <input type="date" id="workoutDate" required
                                class="w-full px-2.5 sm:px-3 py-2 text-xs sm:text-sm bg-slate-50 focus:bg-white rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                        </div>
                        <div class="min-w-0">
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">
                                4. 地點 <span class="text-slate-400 font-normal">(選填)</span>
                            </label>
                            <input type="text" id="workoutLocation" placeholder="例：健身房、操場"
                                class="w-full px-2.5 sm:px-3 py-2 text-xs sm:text-sm h-[40px] bg-slate-50 focus:bg-white rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                        </div>
                    </div>

                    <!-- 2. 運動類別與常用運動清單 (內建直接可見的編輯與刪除區塊) -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-xs font-bold text-slate-700">
                                2. 運動類別 / 常用清單 <span class="text-rose-500">*</span>
                            </label>
                            <button type="button" onclick="toggleInlineCategoryManager()" id="toggleCatManagerBtn"
                                class="text-xs text-white bg-indigo-600 hover:bg-indigo-500 active:scale-95 font-bold flex items-center gap-1.5 px-3 py-1.5 rounded-xl shadow-sm transition">
                                <i class="fa-solid fa-pen-to-square"></i>
                                <span id="toggleCatManagerText">管理 / 編輯運動類型</span>
                            </button>
                        </div>

                        <!-- 運動類別按鈕網格 (每個按鈕下方直接附帶「編輯」與「刪除」) -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5" id="categoryButtons"></div>

                        <!-- 內嵌展開式：編輯與刪除運動類型區塊 -->
                        <div id="inlineCategoryManagerBox" class="hidden mt-3 p-4 rounded-2xl bg-indigo-50/70 border-2 border-indigo-200 space-y-3.5">
                            <div class="flex items-center justify-between border-b border-indigo-200/70 pb-2.5">
                                <div class="flex items-center gap-2">
                                    <span class="w-6 h-6 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-xs">
                                        <i class="fa-solid fa-sliders"></i>
                                    </span>
                                    <h4 class="text-xs sm:text-sm font-bold text-slate-800">編輯 / 刪除運動類型 (預設與自訂)</h4>
                                </div>
                                <button type="button" onclick="resetDefaultCategories()"
                                    class="text-[11px] font-bold text-indigo-700 hover:text-indigo-900 bg-white px-2.5 py-1 rounded-lg border border-indigo-200 shadow-sm transition flex items-center gap-1">
                                    <i class="fa-solid fa-rotate-left"></i>
                                    <span>恢復預設運動</span>
                                </button>
                            </div>

                            <p class="text-xs text-slate-600 leading-relaxed">
                                可直接修改下方預設或自訂運動的<strong>名稱</strong>與<strong>紀錄模式</strong>，改完後按「<strong>儲存</strong>」即可更新；或按「<strong>刪除</strong>」移除該類型。
                            </p>

                            <!-- 內嵌編輯列表 -->
                            <div id="inlineCategoryManagerList" class="space-y-2 max-h-72 overflow-y-auto pr-1"></div>

                            <!-- 內嵌快速新增常用運動 -->
                            <div class="pt-2.5 border-t border-indigo-200/70">
                                <label class="block text-xs font-bold text-slate-700 mb-1.5">新增常用運動類型</label>
                                <div class="flex flex-col sm:flex-row gap-2">
                                    <input type="text" id="inlineNewCatName" placeholder="輸入名稱 (例：羽球、游泳、單車)"
                                        class="flex-1 px-3 py-2 text-xs sm:text-sm bg-white rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                                    <select id="inlineNewCatMode"
                                        class="px-3 py-2 text-xs sm:text-sm bg-white rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                                        <option value="note">一般備註模式</option>
                                        <option value="weight">重訓組數模式</option>
                                        <option value="run">跑步距離模式</option>
                                    </select>
                                    <button type="button" onclick="addCategoryFromInline()"
                                        class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-sm transition shrink-0">
                                        + 新增常用
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 當選擇「其他 (自訂)」時顯示的自訂輸入與設為常用區塊 -->
                    <div id="customCategoryBox" class="hidden p-3.5 rounded-2xl bg-amber-50/80 border border-amber-200 space-y-2.5">
                        <label class="block text-xs font-bold text-amber-900">
                            自訂運動名稱 <span class="text-rose-500">*</span>
                        </label>
                        <div class="flex flex-col sm:flex-row gap-2">
                            <input type="text" id="customCategoryInput" placeholder="例如：羽球、游泳、瑜珈、攀岩..."
                                class="flex-1 px-3 py-2 text-sm bg-white rounded-xl border border-amber-300 focus:ring-2 focus:ring-amber-500 outline-none">
                            <button type="button" onclick="promoteCustomToFavorite()"
                                class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm transition shrink-0">
                                <i class="fa-solid fa-star"></i>
                                <span>設為常用運動</span>
                            </button>
                        </div>
                        <label class="inline-flex items-center gap-2 text-xs text-amber-800 cursor-pointer select-none">
                            <input type="checkbox" id="autoSaveFavoriteCheck" class="rounded text-amber-600 focus:ring-amber-500">
                            <span>儲存此筆紀錄時，同時將此名稱加入上方「常用運動清單」</span>
                        </label>
                    </div>

                    <!-- 3. 運動時長 (分項填寫：小時 + 分鐘) -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">
                            3. 本項運動時長 <span class="text-rose-500">*</span>
                        </label>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="relative">
                                <input type="number" id="durationHours" min="0" max="24" placeholder="0" value="1"
                                    class="w-full pl-3 pr-12 py-2.5 text-sm bg-slate-50 focus:bg-white rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-400">小時 (hr)</span>
                            </div>
                            <div class="relative">
                                <input type="number" id="durationMinutes" min="0" max="59" placeholder="0" value="0"
                                    class="w-full pl-3 pr-12 py-2.5 text-sm bg-slate-50 focus:bg-white rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-400">分鐘 (min)</span>
                            </div>
                        </div>
                    </div>

                    <!-- 動態內容區 A：重訓模式 (動作 -> 多組重量/次數/組數 + 訓練量試算) -->
                    <div id="weightTrainingSection" class="space-y-3 pt-1">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-xs font-bold text-slate-800">重訓動作與組數明細</h3>
                                <p class="text-[11px] text-slate-500">未填重量時以「次數 × 組數」計算訓練量</p>
                            </div>
                            <div class="text-right">
                                <span class="text-[11px] text-slate-500 block">本項預估總訓練量</span>
                                <span id="liveVolumePreview" class="text-sm font-extrabold text-indigo-600">0</span>
                            </div>
                        </div>

                        <div id="exerciseBlocksContainer" class="space-y-3"></div>

                        <button type="button" onclick="addExerciseBlock()"
                            class="w-full py-2.5 rounded-xl border-2 border-dashed border-indigo-300 hover:border-indigo-500 text-indigo-600 hover:bg-indigo-50/50 text-xs font-bold flex items-center justify-center gap-1.5 transition">
                            <i class="fa-solid fa-plus"></i>
                            <span>新增重訓動作 (例如：squat、滑輪下拉)</span>
                        </button>
                    </div>

                    <!-- 動態內容區 B：跑步模式 (距離 km) -->
                    <div id="runningSection" class="hidden space-y-2 pt-1">
                        <label class="block text-xs font-bold text-slate-700">
                            跑步距離 (km) <span class="text-rose-500">*</span>
                        </label>
                        <div class="relative">
                            <input type="number" id="runningDistance" min="0" step="0.01" placeholder="例如：3 或 5.25"
                                class="w-full pl-3.5 pr-12 py-2.5 text-sm bg-slate-50 focus:bg-white rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">km</span>
                        </div>
                    </div>

                    <!-- 動態內容區 C：徒手訓練 / 其他一般備註模式 -->
                    <div id="noteSection" class="hidden space-y-2 pt-1">
                        <label class="block text-xs font-bold text-slate-700">
                            訓練內容 / 備註說明 <span class="text-slate-400 font-normal">(選填)</span>
                        </label>
                        <textarea id="workoutNote" rows="3" placeholder="輸入訓練項目或心得（可換行輸入多項，例如：伏地挺身 20*4、棒式 1min*3）"
                            class="w-full px-3.5 py-2.5 text-sm bg-slate-50 focus:bg-white rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>

                    <!-- 送出按鈕 -->
                    <div class="pt-2">
                        <button type="submit" id="submitWorkoutBtn"
                            class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold text-sm shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span id="submitWorkoutBtnText">儲存此項運動紀錄</span>
                        </button>
                    </div>
                </form>
            </section>

            <!-- 右側：單日綜整紀錄看板 (佔 7 欄) -->
            <section class="lg:col-span-7 space-y-4">
                <!-- 篩選與統計列 -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-calendar-check text-indigo-600"></i>
                            <span>每日運動綜整看板</span>
                        </h2>
                        <p class="text-xs text-slate-500">同日多筆運動自動左右併排，支援單項獨立編輯與刪除</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <label class="text-xs font-semibold text-slate-600">月份篩選：</label>
                        <input type="month" id="filterMonthInput" onchange="renderDashboard()"
                            class="w-36 sm:w-44 px-2.5 py-1.5 text-xs sm:text-sm bg-slate-50 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button type="button" onclick="clearMonthFilter()"
                            class="px-2.5 py-1.5 h-[40px] text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-xl transition">
                            顯示全部
                        </button>
                    </div>
                </div>

                <!-- 統計摘要小卡 -->
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm">
                        <span class="text-[11px] font-semibold text-slate-400 block">紀錄天數</span>
                        <span id="statTotalDays" class="text-lg sm:text-2xl font-extrabold text-slate-800">0 天</span>
                    </div>
                    <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm">
                        <span class="text-[11px] font-semibold text-slate-400 block">累積總時長</span>
                        <span id="statTotalDuration" class="text-lg sm:text-2xl font-extrabold text-indigo-600">0min</span>
                    </div>
                    <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm">
                        <span class="text-[11px] font-semibold text-slate-400 block">累積重訓總量</span>
                        <span id="statTotalVolume" class="text-lg sm:text-2xl font-extrabold text-emerald-600">0</span>
                    </div>
                </div>

                <!-- 單日綜整卡片容器 -->
                <div id="dailyCardsContainer" class="space-y-4"></div>
            </section>
        </div>
    </main>

    <!-- 匯出報表彈窗 (支援選擇整月或特定幾日，輸出 CSV / Word / PDF) -->
    <div id="exportModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
            <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <i class="fa-solid fa-file-export text-emerald-400"></i>
                    <h3 class="text-base font-bold">一鍵匯出運動紀錄報表</h3>
                </div>
                <button type="button" onclick="closeExportModal()" class="text-slate-400 hover:text-white text-lg px-2">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-5 overflow-y-auto space-y-5 flex-1">
                <!-- 步驟 1：選擇日期範圍模式 -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-2">1. 選擇要匯出的日期範圍</label>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button type="button" id="exportModeMonthBtn" onclick="setExportRangeMode('month')"
                            class="py-2.5 px-3 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 text-xs font-bold flex items-center justify-center gap-2 transition">
                            <i class="fa-regular fa-calendar"></i>
                            <span>依整個月匯出</span>
                        </button>
                        <button type="button" id="exportModeCustomBtn" onclick="setExportRangeMode('custom')"
                            class="py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 text-xs font-bold flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-list-check"></i>
                            <span>自由勾選某幾日</span>
                        </button>
                    </div>
                </div>

                <!-- 整月選擇器 -->
                <div id="exportMonthSelectorBox" class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">選擇目標月份</label>
                    <input type="month" id="exportMonthInput" onchange="updateExportPreview()"
                        class="w-44 sm:w-56 px-3 py-2 text-sm bg-white rounded-xl border border-slate-300 outline-none">
                </div>

                <!-- 自由勾選多日選擇器 -->
                <div id="exportCustomDaysBox" class="hidden p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-700">勾選要匯出的日期</label>
                        <div class="flex gap-2">
                            <button type="button" onclick="toggleAllExportDates(true)" class="text-xs text-indigo-600 font-bold hover:underline">全選</button>
                            <span class="text-slate-300">|</span>
                            <button type="button" onclick="toggleAllExportDates(false)" class="text-xs text-slate-500 font-bold hover:underline">全不選</button>
                        </div>
                    </div>
                    <div id="exportDatesCheckboxList" class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-48 overflow-y-auto p-1"></div>
                </div>

                <!-- 匯出預覽摘要 -->
                <div class="p-3.5 rounded-xl bg-emerald-50/70 border border-emerald-200 flex items-center justify-between">
                    <div class="text-xs text-emerald-900">
                        已選取 <strong id="exportSelectedDaysCount" class="text-sm font-extrabold">0</strong> 天，共包含 <strong id="exportSelectedSessionsCount" class="text-sm font-extrabold">0</strong> 筆運動項目
                    </div>
                </div>
            </div>

            <!-- 底部三種匯出按鈕 -->
            <div class="px-5 py-4 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-end gap-2.5">
                <button type="button" onclick="exportAsCSV()"
                    class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-table"></i>
                    <span>下載 Google 試算表 (.csv)</span>
                </button>
                <button type="button" onclick="exportAsWord()"
                    class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-file-word"></i>
                    <span>下載 Word 報表 (.doc)</span>
                </button>
                <button type="button" onclick="exportAsPDF()"
                    class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>列印 / 存成 PDF</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 列印 / PDF 專用隱藏區 -->
    <div id="printReportArea" class="hidden print-only p-6"></div>

    <!-- 自訂確認彈窗 (取代 window.confirm) -->
    <div id="confirmModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 space-y-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <h4 id="confirmModalTitle" class="text-sm font-bold text-slate-800">確認操作</h4>
                    <p id="confirmModalMessage" class="text-xs text-slate-600 mt-0.5"></p>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeConfirmModal()"
                    class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
                    取消
                </button>
                <button type="button" id="confirmModalOkBtn"
                    class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition">
                    確定執行
                </button>
            </div>
        </div>
    </div>

    <!-- Toast 通知容器 -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 no-print"></div>

    <script>
        // ==========================================
        // LocalStorage Keys 與全域狀態
        // ==========================================
        const STORAGE_KEY = 'daily_workout_sessions_v2';
        const CATEGORIES_KEY = 'daily_workout_categories_v2';

        // 系統預設運動類型（不包含桌球，使用者可自由編輯名稱、切換模式或刪除）
        const SYSTEM_DEFAULT_CATEGORIES = [
            { id: 'cat_weight', name: '重訓', mode: 'weight', icon: 'fa-dumbbell', isDefault: true },
            { id: 'cat_run', name: '跑步', mode: 'run', icon: 'fa-person-running', isDefault: true },
            { id: 'cat_bodyweight', name: '徒手訓練', mode: 'note', icon: 'fa-child-reaching', isDefault: true }
        ];

        let sessions = [];
        let categories = [];
        let currentCategory = '重訓';
        let exportRangeMode = 'month'; // 'month' | 'custom'
        let confirmCallback = null;

        // ==========================================
        // 工具函式
        // ==========================================
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colorMap = {
                success: 'bg-slate-900 text-white border-emerald-500',
                warning: 'bg-amber-600 text-white border-amber-300',
                error: 'bg-rose-600 text-white border-rose-300'
            };
            toast.className = `px-4 py-3 rounded-xl shadow-lg border-l-4 text-xs font-bold flex items-center gap-2.5 transition-all duration-300 ${colorMap[type] || colorMap.success}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        function openConfirmModal(title, message, onConfirm) {
            document.getElementById('confirmModalTitle').textContent = title;
            document.getElementById('confirmModalMessage').textContent = message;
            confirmCallback = onConfirm;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('confirmModalOkBtn').addEventListener('click', () => {
            if (typeof confirmCallback === 'function') {
                confirmCallback();
            }
            closeConfirmModal();
        });

        // 格式化時長：例如 1hr、2hr15min、45min
        function formatDuration(hours, minutes) {
            const h = parseInt(hours, 10) || 0;
            const m = parseInt(minutes, 10) || 0;
            if (h > 0 && m > 0) return `${h}hr${m}min`;
            if (h > 0) return `${h}hr`;
            return `${m}min`;
        }

        // 格式化日期：2026-11-01 -> 2026/11/1
        function formatDisplayDate(isoDate) {
            if (!isoDate) return '';
            const parts = isoDate.split('-');
            if (parts.length !== 3) return isoDate;
            return `${parts[0]}/${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
        }

        // 計算單組訓練量：有填重量 = 重量 * 次數 * 組數；沒填重量 = 次數 * 組數
        function calcSetVolume(weight, reps, sets) {
            const r = parseFloat(reps) || 0;
            const s = parseFloat(sets) || 0;
            const hasWeight = weight !== '' && weight !== null && weight !== undefined && !isNaN(parseFloat(weight)) && parseFloat(weight) > 0;
            if (hasWeight) {
                return parseFloat(weight) * r * s;
            }
            return r * s;
        }

        // 方案 A 顯示格式：有重量顯示「60kg * 10次 * 5組」，無重量顯示「10次 * 5組」
        function formatSetString(weight, reps, sets) {
            const r = parseInt(reps, 10) || 0;
            const s = parseInt(sets, 10) || 0;
            const hasWeight = weight !== '' && weight !== null && weight !== undefined && !isNaN(parseFloat(weight)) && parseFloat(weight) > 0;
            if (hasWeight) {
                return `${parseFloat(weight)}kg * ${r}次 * ${s}組`;
            }
            return `${r}次 * ${s}組`;
        }

        // ==========================================
        // LocalStorage 讀取與儲存
        // ==========================================
        function loadFromStorage() {
            try {
                const rawSessions = localStorage.getItem(STORAGE_KEY);
                sessions = rawSessions ? JSON.parse(rawSessions) : [];
                if (!Array.isArray(sessions)) sessions = [];
            } catch (e) {
                sessions = [];
            }

            try {
                const rawCats = localStorage.getItem(CATEGORIES_KEY);
                if (rawCats) {
                    const parsed = JSON.parse(rawCats);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        categories = parsed;
                    } else {
                        categories = JSON.parse(JSON.stringify(SYSTEM_DEFAULT_CATEGORIES));
                    }
                } else {
                    categories = JSON.parse(JSON.stringify(SYSTEM_DEFAULT_CATEGORIES));
                }
            } catch (e) {
                categories = JSON.parse(JSON.stringify(SYSTEM_DEFAULT_CATEGORIES));
            }
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
        }

        function saveCategories() {
            localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
        }

        // ==========================================
        // 運動類別管理 (新增 / 編輯名稱與模式 / 刪除 / 恢復預設)
        // ==========================================
        function getCategoryMeta(catName) {
            return categories.find(c => c.name === catName) || null;
        }

        function renderCategoryButtons() {
            const container = document.getElementById('categoryButtons');
            const catsHTML = categories.map(c => {
                const isSelected = currentCategory === c.name;
                const activeClass = isSelected
                    ? 'border-indigo-600 ring-2 ring-indigo-500/30 bg-indigo-50/60'
                    : 'border-slate-200 bg-white hover:border-slate-300';
                const btnTextClass = isSelected ? 'text-indigo-700 font-bold' : 'text-slate-700 font-semibold';
                const iconColor = c.icon === 'fa-star' ? 'text-amber-500' : (isSelected ? 'text-indigo-600' : 'text-slate-500');

                return `
                    <div class="flex flex-col rounded-xl border ${activeClass} overflow-hidden shadow-2xs transition">
                        <button type="button" onclick="selectCategory('${escapeHtml(c.name)}')" data-cat="${escapeHtml(c.name)}"
                            class="w-full min-h-[50px] py-2 px-2 text-xs ${btnTextClass} text-center transition flex flex-col items-center justify-center gap-1">
                            <i class="fa-solid ${escapeHtml(c.icon || 'fa-dumbbell')} ${iconColor} text-sm"></i>
                            <span class="truncate max-w-full">${escapeHtml(c.name)}</span>
                        </button>
                        <div class="grid grid-cols-2 border-t border-slate-200/70 bg-slate-50 text-[11px] divide-x divide-slate-200/70">
                            <button type="button" onclick="openInlineEditForCategory(event, '${escapeHtml(c.id)}')"
                                class="py-1 text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 font-medium transition flex items-center justify-center gap-1"
                                title="編輯「${escapeHtml(c.name)}」">
                                <i class="fa-solid fa-pen text-[10px]"></i>
                                <span>編輯</span>
                            </button>
                            <button type="button" onclick="removeCategoryQuick(event, '${escapeHtml(c.id)}')"
                                class="py-1 text-slate-600 hover:text-rose-600 hover:bg-rose-50 font-medium transition flex items-center justify-center gap-1"
                                title="刪除「${escapeHtml(c.name)}」">
                                <i class="fa-solid fa-trash-can text-[10px]"></i>
                                <span>刪除</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            const isOtherSelected = currentCategory === '其他';
            const otherActiveClass = isOtherSelected
                ? 'border-indigo-600 ring-2 ring-indigo-500/30 bg-indigo-50/60 text-indigo-700 font-bold'
                : 'border-slate-200 bg-white text-slate-700 font-semibold hover:border-slate-300';

            const otherHTML = `
                <div class="flex flex-col rounded-xl border ${otherActiveClass} overflow-hidden shadow-2xs transition">
                    <button type="button" onclick="selectCategory('其他')" data-cat="其他"
                        class="w-full h-full min-h-[74px] py-2 px-2 text-xs text-center transition flex flex-col items-center justify-center gap-1">
                        <i class="fa-solid fa-plus-circle text-sm ${isOtherSelected ? 'text-indigo-600' : 'text-slate-500'}"></i>
                        <span>其他 (自訂)</span>
                    </button>
                </div>
            `;

            container.innerHTML = catsHTML + otherHTML;
            renderInlineCategoryManagerList();
        }

        function selectCategory(catName) {
            currentCategory = catName;
            renderCategoryButtons();

            const customBox = document.getElementById('customCategoryBox');
            const weightSec = document.getElementById('weightTrainingSection');
            const runSec = document.getElementById('runningSection');
            const noteSec = document.getElementById('noteSection');

            customBox.classList.add('hidden');
            weightSec.classList.add('hidden');
            runSec.classList.add('hidden');
            noteSec.classList.add('hidden');

            if (catName === '其他') {
                customBox.classList.remove('hidden');
                noteSec.classList.remove('hidden');
                return;
            }

            const meta = getCategoryMeta(catName);
            const mode = meta ? meta.mode : 'note';

            if (mode === 'weight') {
                weightSec.classList.remove('hidden');
                if (document.getElementById('exerciseBlocksContainer').children.length === 0) {
                    resetExerciseBlocks();
                }
            } else if (mode === 'run') {
                runSec.classList.remove('hidden');
            } else {
                noteSec.classList.remove('hidden');
            }
        }

        function toggleInlineCategoryManager(forceOpen = null) {
            const box = document.getElementById('inlineCategoryManagerBox');
            const btnText = document.getElementById('toggleCatManagerText');
            const isHidden = box.classList.contains('hidden');
            const shouldOpen = forceOpen !== null ? forceOpen : isHidden;

            if (shouldOpen) {
                renderInlineCategoryManagerList();
                box.classList.remove('hidden');
                btnText.textContent = '收合編輯面板';
            } else {
                box.classList.add('hidden');
                btnText.textContent = '管理 / 編輯運動類型';
            }
        }

        function openInlineEditForCategory(e, catId) {
            if (e) e.stopPropagation();
            toggleInlineCategoryManager(true);
            setTimeout(() => {
                const input = document.getElementById(`inlineEditCatName_${catId}`);
                if (input) {
                    input.focus();
                    input.select();
                }
            }, 60);
        }

        function renderInlineCategoryManagerList() {
            const listEl = document.getElementById('inlineCategoryManagerList');
            if (!listEl) return;

            if (categories.length === 0) {
                listEl.innerHTML = `
                    <div class="p-3 text-center text-xs text-slate-500 bg-white rounded-xl border border-dashed border-slate-300">
                        目前沒有任何常用運動類型，請點擊右上角「恢復預設運動」或從下方新增。
                    </div>
                `;
                return;
            }

            listEl.innerHTML = categories.map(c => `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-2.5 rounded-xl bg-white border border-slate-200 shadow-2xs">
                    <div class="flex items-center gap-2 flex-1">
                        <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center shrink-0 text-xs">
                            <i class="fa-solid ${escapeHtml(c.icon || 'fa-dumbbell')} ${c.icon === 'fa-star' ? 'text-amber-500' : ''}"></i>
                        </span>
                        <input type="text" value="${escapeHtml(c.name)}" id="inlineEditCatName_${escapeHtml(c.id)}"
                            class="w-full px-2.5 py-1.5 text-xs sm:text-sm font-bold text-slate-800 bg-slate-50 focus:bg-white rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none"
                            placeholder="輸入運動名稱">
                    </div>
                    <div class="flex items-center gap-1.5 justify-end">
                        <select id="inlineEditCatMode_${escapeHtml(c.id)}"
                            class="px-2 py-1.5 text-xs font-medium text-slate-700 bg-slate-50 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="weight" ${c.mode === 'weight' ? 'selected' : ''}>重訓組數</option>
                            <option value="run" ${c.mode === 'run' ? 'selected' : ''}>跑步距離</option>
                            <option value="note" ${(!c.mode || c.mode === 'note') ? 'selected' : ''}>一般備註</option>
                        </select>
                        <button type="button" onclick="saveInlineCategoryEdit('${escapeHtml(c.id)}')"
                            class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg transition shrink-0">
                            儲存
                        </button>
                        <button type="button" onclick="deleteCategoryById('${escapeHtml(c.id)}')"
                            class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white text-xs font-bold flex items-center gap-1 transition shrink-0">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>刪除</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function saveInlineCategoryEdit(catId) {
            const target = categories.find(c => c.id === catId);
            if (!target) return;

            const nameInput = document.getElementById(`inlineEditCatName_${catId}`);
            const modeSelect = document.getElementById(`inlineEditCatMode_${catId}`);
            const newName = nameInput.value.trim();
            const newMode = modeSelect.value;

            if (!newName) {
                showToast('運動類型名稱不能為空', 'warning');
                return;
            }
            if (newName === '其他' || categories.some(c => c.id !== catId && c.name === newName)) {
                showToast(`「${newName}」名稱已存在，請使用其他名稱`, 'warning');
                return;
            }

            const oldName = target.name;
            target.name = newName;
            target.mode = newMode;
            if (!target.isDefault) {
                const iconMap = { weight: 'fa-dumbbell', run: 'fa-person-running', note: 'fa-star' };
                target.icon = iconMap[newMode] || 'fa-star';
            }

            // 同步更新歷史紀錄中的名稱
            sessions.forEach(s => {
                if (s.displayCategory === oldName || s.category === oldName) {
                    s.displayCategory = newName;
                    s.category = newName;
                }
            });

            saveCategories();
            saveToStorage();

            if (currentCategory === oldName) {
                currentCategory = newName;
            }

            renderCategoryButtons();
            selectCategory(currentCategory);
            renderDashboard();
            showToast(`已將運動類型更新為「${newName}」！`, 'success');
        }

        function removeCategoryQuick(e, catId) {
            if (e) e.stopPropagation();
            deleteCategoryById(catId);
        }

        function deleteCategoryById(catId) {
            const target = categories.find(c => c.id === catId);
            if (!target) return;

            openConfirmModal(
                `刪除運動類型「${target.name}」`,
                `確定要從清單移除「${target.name}」嗎？（已儲存的歷史運動紀錄不會被刪除）`,
                () => {
                    categories = categories.filter(c => c.id !== catId);
                    saveCategories();
                    if (currentCategory === target.name) {
                        currentCategory = categories.length > 0 ? categories[0].name : '其他';
                    }
                    renderCategoryButtons();
                    selectCategory(currentCategory);
                    showToast(`已刪除運動類型「${target.name}」`, 'success');
                }
            );
        }

        function resetDefaultCategories() {
            SYSTEM_DEFAULT_CATEGORIES.forEach(def => {
                const exists = categories.some(c => c.name === def.name);
                if (!exists) {
                    categories.unshift({ ...def, id: 'cat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) });
                }
            });
            saveCategories();
            renderCategoryButtons();
            selectCategory(categories[0].name);
            showToast('已恢復系統預設運動類型（重訓、跑步、徒手訓練）', 'success');
        }

        function addFavoriteCategoryByName(name, mode = 'note') {
            const clean = name.trim();
            if (!clean) return false;
            if (clean === '其他' || categories.some(c => c.name === clean)) {
                showToast(`「${clean}」已經在常用運動清單中了`, 'warning');
                return false;
            }
            const iconMap = { weight: 'fa-dumbbell', run: 'fa-person-running', note: 'fa-star' };
            categories.push({
                id: 'cat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                name: clean,
                mode: mode,
                icon: iconMap[mode] || 'fa-star',
                isDefault: false
            });
            saveCategories();
            renderCategoryButtons();
            showToast(`已將「${clean}」加入常用運動清單！`, 'success');
            return true;
        }

        function addCategoryFromInline() {
            const nameInput = document.getElementById('inlineNewCatName');
            const modeSelect = document.getElementById('inlineNewCatMode');
            const name = nameInput.value.trim();
            const mode = modeSelect.value;

            if (!name) {
                showToast('請先輸入要新增的運動名稱', 'warning');
                nameInput.focus();
                return;
            }
            if (addFavoriteCategoryByName(name, mode)) {
                nameInput.value = '';
                selectCategory(name);
            }
        }

        function promoteCustomToFavorite() {
            const input = document.getElementById('customCategoryInput');
            const val = input.value.trim();
            if (!val) {
                showToast('請先輸入自訂運動名稱', 'warning');
                input.focus();
                return;
            }
            if (addFavoriteCategoryByName(val, 'note')) {
                input.value = '';
                selectCategory(val);
            }
        }

        // ==========================================
        // 重訓動態動作與組數管理
        // ==========================================
        function resetExerciseBlocks() {
            const container = document.getElementById('exerciseBlocksContainer');
            container.innerHTML = '';
            addExerciseBlock();
            updateLiveVolumePreview();
        }

        function addExerciseBlock(exerciseData = null) {
            const container = document.getElementById('exerciseBlocksContainer');
            const block = document.createElement('div');
            block.className = 'exercise-block p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5';

            const exName = exerciseData ? exerciseData.name : '';
            block.innerHTML = `
                <div class="flex items-center justify-between gap-2">
                    <input type="text" placeholder="動作名稱 (例如：squat、滑輪下拉)" value="${escapeHtml(exName)}"
                        class="exercise-name-input flex-1 px-3 py-2 text-xs sm:text-sm font-bold bg-white rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button type="button" onclick="removeExerciseBlock(this)"
                        class="px-2.5 py-2 text-xs font-bold text-slate-400 hover:text-rose-600 rounded-lg transition" title="刪除此動作">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
                <div class="grid grid-cols-12 gap-1.5 text-[11px] font-bold text-slate-500 px-1">
                    <div class="col-span-4">重量 kg (選填)</div>
                    <div class="col-span-3">次數 <span class="text-rose-500">*</span></div>
                    <div class="col-span-3">組數 <span class="text-rose-500">*</span></div>
                    <div class="col-span-2 text-right">操作</div>
                </div>
                <div class="sets-container space-y-2"></div>
                <button type="button" onclick="addSetRow(this)"
                    class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 pt-1">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>新增一組不同重量/次數</span>
                </button>
            `;

            container.appendChild(block);
            const setsContainer = block.querySelector('.sets-container');

            if (exerciseData && Array.isArray(exerciseData.sets) && exerciseData.sets.length > 0) {
                exerciseData.sets.forEach(s => appendSetElement(setsContainer, s));
            } else {
                appendSetElement(setsContainer);
            }
            updateLiveVolumePreview();
        }

        function removeExerciseBlock(btn) {
            const container = document.getElementById('exerciseBlocksContainer');
            if (container.children.length <= 1) {
                showToast('至少需保留一個重訓動作區塊', 'warning');
                return;
            }
            btn.closest('.exercise-block').remove();
            updateLiveVolumePreview();
        }

        function addSetRow(btn) {
            const setsContainer = btn.closest('.exercise-block').querySelector('.sets-container');
            appendSetElement(setsContainer);
            updateLiveVolumePreview();
        }

        function appendSetElement(setsContainer, setData = null) {
            const row = document.createElement('div');
            row.className = 'set-row grid grid-cols-12 gap-1.5 items-center';
            const w = setData && setData.weight !== null && setData.weight !== undefined ? setData.weight : '';
            const r = setData && setData.reps !== undefined ? setData.reps : '';
            const s = setData && setData.sets !== undefined ? setData.sets : 1;

            row.innerHTML = `
                <div class="col-span-4">
                    <input type="number" step="0.5" min="0" placeholder="徒手免填" value="${escapeHtml(w)}"
                        oninput="updateLiveVolumePreview()"
                        class="set-weight w-full px-2.5 py-1.5 text-xs sm:text-sm bg-white rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="col-span-3">
                    <input type="number" min="1" placeholder="次數" value="${escapeHtml(r)}"
                        oninput="updateLiveVolumePreview()"
                        class="set-reps w-full px-2.5 py-1.5 text-xs sm:text-sm bg-white rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="col-span-3">
                    <input type="number" min="1" placeholder="組數" value="${escapeHtml(s)}"
                        oninput="updateLiveVolumePreview()"
                        class="set-sets w-full px-2.5 py-1.5 text-xs sm:text-sm bg-white rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="col-span-2 flex justify-end">
                    <button type="button" onclick="removeSetRow(this)"
                        class="w-7 h-7 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 flex items-center justify-center transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `;
            setsContainer.appendChild(row);
        }

        function removeSetRow(btn) {
            const setsContainer = btn.closest('.sets-container');
            if (setsContainer.children.length <= 1) {
                showToast('每個動作至少需保留一組紀錄', 'warning');
                return;
            }
            btn.closest('.set-row').remove();
            updateLiveVolumePreview();
        }

        function updateLiveVolumePreview() {
            let total = 0;
            document.querySelectorAll('#exerciseBlocksContainer .exercise-block').forEach(block => {
                block.querySelectorAll('.set-row').forEach(row => {
                    const w = row.querySelector('.set-weight').value;
                    const r = row.querySelector('.set-reps').value;
                    const s = row.querySelector('.set-sets').value;
                    total += calcSetVolume(w, r, s);
                });
            });
            document.getElementById('liveVolumePreview').textContent = total.toLocaleString();
        }

        // ==========================================
        // 儲存與編輯運動紀錄 (CRUD)
        // ==========================================
        function handleSaveWorkout(e) {
            e.preventDefault();

            const date = document.getElementById('workoutDate').value;
            const location = document.getElementById('workoutLocation').value.trim();
            const hours = parseInt(document.getElementById('durationHours').value, 10) || 0;
            const minutes = parseInt(document.getElementById('durationMinutes').value, 10) || 0;
            const editingId = document.getElementById('editingSessionId').value;

            if (!date) {
                showToast('請選擇運動日期', 'warning');
                return;
            }
            if (hours === 0 && minutes === 0) {
                showToast('請輸入運動時長（小時或分鐘至少一項大於 0）', 'warning');
                return;
            }

            let displayCategory = currentCategory;
            let mode = 'note';

            if (currentCategory === '其他') {
                const customName = document.getElementById('customCategoryInput').value.trim();
                if (!customName) {
                    showToast('請輸入自訂運動名稱', 'warning');
                    document.getElementById('customCategoryInput').focus();
                    return;
                }
                displayCategory = customName;
                mode = 'note';

                if (document.getElementById('autoSaveFavoriteCheck').checked) {
                    addFavoriteCategoryByName(customName, 'note');
                }
            } else {
                const meta = getCategoryMeta(currentCategory);
                mode = meta ? meta.mode : 'note';
            }

            let exercises = [];
            let totalVolume = 0;
            let distance = null;
            let note = '';

            if (mode === 'weight') {
                const blocks = document.querySelectorAll('#exerciseBlocksContainer .exercise-block');
                for (const block of blocks) {
                    const exName = block.querySelector('.exercise-name-input').value.trim();
                    if (!exName) {
                        showToast('請填寫重訓動作名稱（例如：squat）', 'warning');
                        block.querySelector('.exercise-name-input').focus();
                        return;
                    }
                    const setsArr = [];
                    const rows = block.querySelectorAll('.set-row');
                    for (const row of rows) {
                        const wRaw = row.querySelector('.set-weight').value.trim();
                        const rRaw = parseInt(row.querySelector('.set-reps').value, 10);
                        const sRaw = parseInt(row.querySelector('.set-sets').value, 10);

                        if (!rRaw || rRaw <= 0 || !sRaw || sRaw <= 0) {
                            showToast(`請填寫「${exName}」的次數與組數`, 'warning');
                            return;
                        }
                        const weightVal = wRaw !== '' ? parseFloat(wRaw) : null;
                        const vol = calcSetVolume(weightVal, rRaw, sRaw);
                        totalVolume += vol;
                        setsArr.push({
                            weight: weightVal,
                            reps: rRaw,
                            sets: sRaw,
                            volume: vol
                        });
                    }
                    exercises.push({ name: exName, sets: setsArr });
                }
            } else if (mode === 'run') {
                const distVal = parseFloat(document.getElementById('runningDistance').value);
                if (isNaN(distVal) || distVal <= 0) {
                    showToast('請輸入有效的跑步距離 (km)', 'warning');
                    document.getElementById('runningDistance').focus();
                    return;
                }
                distance = distVal;
            } else {
                note = document.getElementById('workoutNote').value.trim();
            }

            const sessionPayload = {
                id: editingId || ('sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)),
                date,
                category: displayCategory,
                displayCategory,
                mode,
                hours,
                minutes,
                location,
                exercises,
                totalVolume,
                distance,
                note
            };

            if (editingId) {
                const idx = sessions.findIndex(s => s.id === editingId);
                if (idx !== -1) {
                    sessions[idx] = sessionPayload;
                }
                showToast(`已更新 ${formatDisplayDate(date)} 的「${displayCategory}」紀錄！`, 'success');
            } else {
                sessions.push(sessionPayload);
                showToast(`已新增 ${formatDisplayDate(date)} 的「${displayCategory}」紀錄！`, 'success');
            }

            saveToStorage();
            resetWorkoutForm(date);
            renderDashboard();
        }

        function editSession(sessionId) {
            const target = sessions.find(s => s.id === sessionId);
            if (!target) return;

            document.getElementById('editingSessionId').value = target.id;
            document.getElementById('workoutDate').value = target.date;
            document.getElementById('workoutLocation').value = target.location || '';
            document.getElementById('durationHours').value = target.hours || 0;
            document.getElementById('durationMinutes').value = target.minutes || 0;

            const knownCat = categories.find(c => c.name === target.displayCategory);
            if (knownCat) {
                selectCategory(knownCat.name);
            } else {
                selectCategory('其他');
                document.getElementById('customCategoryInput').value = target.displayCategory || '';
            }

            if (target.mode === 'weight') {
                const container = document.getElementById('exerciseBlocksContainer');
                container.innerHTML = '';
                (target.exercises || []).forEach(ex => addExerciseBlock(ex));
                updateLiveVolumePreview();
            } else if (target.mode === 'run') {
                document.getElementById('runningDistance').value = target.distance || '';
            } else {
                document.getElementById('workoutNote').value = target.note || '';
            }

            document.getElementById('formTitle').textContent = `編輯：${target.displayCategory} (${formatDisplayDate(target.date)})`;
            document.getElementById('submitWorkoutBtnText').textContent = '儲存修改內容';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteSession(sessionId) {
            const target = sessions.find(s => s.id === sessionId);
            if (!target) return;

            openConfirmModal(
                '刪除此項運動紀錄',
                `確定要刪除 ${formatDisplayDate(target.date)} 的「${target.displayCategory}」紀錄嗎？`,
                () => {
                    sessions = sessions.filter(s => s.id !== sessionId);
                    saveToStorage();
                    if (document.getElementById('editingSessionId').value === sessionId) {
                        resetWorkoutForm();
                    }
                    renderDashboard();
                    showToast('已刪除該項運動紀錄', 'success');
                }
            );
        }

        function quickAddSameDay(isoDate) {
            resetWorkoutForm(isoDate);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast(`已切換日期至 ${formatDisplayDate(isoDate)}，請直接輸入新運動項目`, 'success');

        function resetWorkoutForm(keepDate = null) {
            const currentDateVal = keepDate || document.getElementById('workoutDate').value || new Date().toISOString().slice(0, 10);
            document.getElementById('editingSessionId').value = '';
            document.getElementById('workoutDate').value = currentDateVal;
            document.getElementById('workoutLocation').value = '';
            document.getElementById('durationHours').value = 1;
            document.getElementById('durationMinutes').value = 0;
            document.getElementById('customCategoryInput').value = '';
            document.getElementById('autoSaveFavoriteCheck').checked = false;
            document.getElementById('runningDistance').value = '';
            document.getElementById('workoutNote').value = '';

            document.getElementById('formTitle').textContent = '新增運動項目';
            document.getElementById('submitWorkoutBtnText').textContent = '儲存此項運動紀錄';
            document.getElementById('cancelEditBtn').classList.add('hidden');

            const defaultCat = categories.length > 0 ? categories[0].name : '其他';
            selectCategory(defaultCat);
            resetExerciseBlocks();
        }

        // ==========================================
        // 渲染右側每日運動綜整看板 (左右併排呈現)
        // ==========================================
        function getFilteredGroupedDays() {
            const monthFilter = document.getElementById('filterMonthInput').value;
            const filtered = monthFilter
                ? sessions.filter(s => s.date && s.date.startsWith(monthFilter))
                : [...sessions];

            const grouped = {};
            filtered.forEach(s => {
                if (!grouped[s.date]) grouped[s.date] = [];
                grouped[s.date].push(s);
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
            return { sortedDates, grouped, filtered };
        }

        function clearMonthFilter() {
            document.getElementById('filterMonthInput').value = '';
            renderDashboard();
        }

            const { sortedDates, grouped, filtered } = getFilteredGroupedDays();
            const container = document.getElementById('dailyCardsContainer');

            document.getElementById('statTotalDays').textContent = `${sortedDates.length} 天`;
            let totalMinutes = 0;
            let totalVol = 0;

                totalMinutes += (parseInt(s.hours, 10) || 0) * 60 + (parseInt(s.minutes, 10) || 0);
                totalVol += (parseFloat(s.totalVolume) || 0);
            });
            const sumH = Math.floor(totalMinutes / 60);

            document.getElementById('statTotalDuration').textContent = formatDuration(sumH, sumM);

        // 將單項運動轉為多行文字陣列（供 CSV 二維併排矩陣使用）
        function buildSessionLinesForMatrix(s) {
            const lines = [];
            const header = `${s.displayCategory} (${formatDuration(s.hours, s.minutes)})${s.location ? ' @' + s.location : ''}`;
            lines.push(header);

            if (s.mode === 'weight') {
                (s.exercises || []).forEach(ex => {
                    lines.push(ex.name);
                    (ex.sets || []).forEach(st => {
                        lines.push(formatSetString(st.weight, st.reps, st.sets));
                    });
                });
                lines.push(`訓練量: ${s.totalVolume || 0}`);
            } else if (s.mode === 'run') {
                lines.push('距離');
                lines.push(`${s.distance}km`);
            } else if (s.note) {
                s.note.split('\n').forEach(l => lines.push(l));
            }
            return lines;
        }

        function csvEscape(cell) {
            const str = String(cell ?? '');
            if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        // 1. 匯出 Google 試算表 (.csv 左右併排視覺排版)
        function exportAsCSV() {
            const { targetDates, grouped } = getSelectedExportData();
            if (targetDates.length === 0) {
                showToast('所選範圍內沒有運動紀錄可匯出', 'warning');
                return;
            }

            const rows = [];
            targetDates.forEach(date => {
                const daySessions = grouped[date];
                rows.push([formatDisplayDate(date)]);

                const sessionColLines = daySessions.map(s => buildSessionLinesForMatrix(s));
                const maxRows = Math.max(...sessionColLines.map(col => col.length), 1);

                for (let r = 0; r < maxRows; r++) {
                    const rowCells = sessionColLines.map(col => col[r] || '');
                    rows.push(rowCells);
                }
                rows.push([]); // 日期之間留一行空白方便閱讀
            });

            const csvContent = '\uFEFF' + rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `每日運動紀錄_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);

            showToast('已下載 CSV 檔案，可直接匯入 Google 試算表！', 'success');
        }

        // 產生供 Word 與 PDF 共用的精美 HTML 報表內容
        function generateReportHTML(targetDates, grouped) {
            const blocks = targetDates.map(date => {
                const daySessions = grouped[date];
                const cols = daySessions.map(s => {
                    const lines = buildSessionLinesForMatrix(s);
                    const titleLine = escapeHtml(lines[0] || '');
                    const bodyLines = lines.slice(1).map(l => `<div style="margin:2px 0;font-size:13px;color:#334155;">${escapeHtml(l)}</div>`).join('');
                    return `
                        <td valign="top" style="border:1px solid #cbd5e1;padding:10px 14px;min-width:180px;background:#f8fafc;">
                            <div style="font-weight:bold;font-size:14px;color:#0f172a;border-bottom:1px solid #e2e8f0;padding-bottom:6px;margin-bottom:6px;">
                                ${titleLine}
                            </div>
                            ${bodyLines}
                        </td>
                    `;
                }).join('');

                return `
                    <div class="print-break-inside-avoid" style="margin-bottom:22px;">
                        <div style="background:#0f172a;color:#ffffff;padding:8px 14px;font-weight:bold;font-size:15px;border-radius:6px 6px 0 0;">
                            ${escapeHtml(formatDisplayDate(date))}
                        </div>
                        <table style="width:100%;border-collapse:collapse;border:1px solid #cbd5e1;">
                            <tr>${cols}</tr>
                        </table>
                    </div>
                `;
            }).join('');

            return `
                <div style="font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#0f172a;">
                    <h2 style="font-size:20px;margin-bottom:4px;">每日運動紀錄綜整報表</h2>
                    <p style="font-size:12px;color:#64748b;margin-top:0;margin-bottom:18px;">匯出日期：${escapeHtml(formatDisplayDate(new Date().toISOString().slice(0, 10)))} （共 ${targetDates.length} 天）</p>
                    ${blocks}
                </div>
            `;
        }

        // 2. 匯出 Word (.doc)
        function exportAsWord() {
            const { targetDates, grouped } = getSelectedExportData();
            if (targetDates.length === 0) {
                showToast('所選範圍內沒有運動紀錄可匯出', 'warning');
                return;
            }

            const reportHtml = generateReportHTML(targetDates, grouped);
            const fullDoc = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>每日運動紀錄</title></head>
                <body>${reportHtml}</body>
                </html>
            `;

            const blob = new Blob(['\ufeff', fullDoc], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `每日運動紀錄_${new Date().toISOString().slice(0, 10)}.doc`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);

            showToast('已下載 Word (.doc) 報表檔案！', 'success');
        }

        // 3. 匯出 PDF (觸發高品質列印)
        function exportAsPDF() {
            const { targetDates, grouped } = getSelectedExportData();
            if (targetDates.length === 0) {
                showToast('所選範圍內沒有運動紀錄可列印', 'warning');
                return;
            }

            const printArea = document.getElementById('printReportArea');
            printArea.innerHTML = generateReportHTML(targetDates, grouped);
            closeExportModal();
            setTimeout(() => {
                window.print();
            }, 150);
        }

        // ==========================================
        // 系統初始化
        // ==========================================
        window.onload = function () {
            loadFromStorage();
            const today = new Date().toISOString().slice(0, 10);
            document.getElementById('workoutDate').value = today;

            renderCategoryButtons();
            const firstCat = categories.length > 0 ? categories[0].name : '其他';
            selectCategory(firstCat);
            resetExerciseBlocks();
            renderDashboard();
        };
    </script>
</body>
</html>
